name: Organizar projeto Criot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "GRIOT-Criot-Testes.zip"
      - ".github/workflows/organizar.yml"

permissions:
  contents: write

jobs:
  organizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extrair e organizar
        shell: bash
        run: |
          set -euo pipefail
          destino="$(mktemp -d)"
          unzip -q GRIOT-Criot-Testes.zip -d "$destino"
          test -f "$destino/GRIOT-Criot-Testes/Dockerfile"
          mkdir -p projeto
          cp -a "$destino/GRIOT-Criot-Testes/." projeto/
          test -f projeto/criot/app/main.py
          test -f projeto/public/index.html

      - name: Salvar no GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projeto
          if git diff --cached --quiet; then
            echo "O projeto ja esta organizado."
          else
            git commit -m "Organizar projeto Criot para Render"
            git push origin HEAD:main
          fi
