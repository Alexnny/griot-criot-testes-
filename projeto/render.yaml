# Serviço separado para testes. Sem chave Gemini obrigatória.
services:
  - type: web
    name: griot-criot-testes
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: CRIOT_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: mock
      - key: SESSION_SECRET
        generateValue: true
